name: Build and Test

# Reusable worker for one ROS distro + architecture. Called by ci-<distro>.yml.
on:
  workflow_call:
    inputs:
      ros_distro:
        description: ROS 2 distribution name
        required: true
        type: string
      arch:
        description: Debian architecture label (amd64 or arm64)
        required: true
        type: string
      os:
        description: GitHub-hosted runner label
        required: true
        type: string
      ros_image_tag:
        description: ros image tag (for example jazzy-ros-base-noble)
        required: true
        type: string
      ros_image_digest:
        description: Pin digest for the ros image tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build, Test, Package (${{ inputs.arch }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    env:
      BUILD_LIVEKIT_SDK_FROM_SOURCE: ${{ inputs.ros_distro == 'humble' && 'true' || 'false' }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      INSTALL_CPP_TOOLS: "false"
      INSTALL_SIMULATION_DEPS: "false"
      ROS_DISTRO: ${{ inputs.ros_distro }}
      ROS_IMAGE: ros:${{ inputs.ros_image_tag }}@sha256:${{ inputs.ros_image_digest }}
      ROS_IMAGE_DIGEST: ${{ inputs.ros_image_digest }}
      ROS_IMAGE_REPOSITORY: ros
      ROS_IMAGE_TAG: ${{ inputs.ros_image_tag }}
      RUNTIME_IMAGE: ros-portal-ci:${{ inputs.ros_distro }}-${{ inputs.arch }}-${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Prepare devcontainer SSH agent mount
        run: touch /tmp/devcontainer-empty-ssh-agent

      - name: Setup devcontainer environment
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          # Starting the container runs postCreateCommand, which imports the SDK
          # checkout before the cache can create a partial SDK directory.
          runCmd: /bin/true

      - name: Prepare LiveKit SDK cache directories
        if: env.BUILD_LIVEKIT_SDK_FROM_SOURCE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for tree in \
            src/externals/client-sdk-cpp/client-sdk-rust/target \
            build/ros_portal/_deps
          do
            sudo mkdir -p "${tree}"
            sudo chown -R "$(id -u):$(id -g)" "${tree}"
          done

      # Restore after setup so vcs imports the SDK before the cache creates its
      # target directory. Keep the Dockerfile hash in the fallback prefix so
      # cached build trees never cross toolchain definitions.
      - name: Restore LiveKit SDK build cache
        id: livekit_sdk_cache
        if: env.BUILD_LIVEKIT_SDK_FROM_SOURCE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/externals/client-sdk-cpp/client-sdk-rust/target
            build/ros_portal/_deps
          key: livekit-sdk-${{ inputs.ros_distro }}-${{ inputs.arch }}-${{ inputs.ros_image_digest }}-${{ hashFiles('Dockerfile') }}-${{ hashFiles('external.repos', 'src/ros_portal/cmake/BuildLiveKitSDK.cmake', 'src/ros_portal/cmake/ConfigureLiveKitSDK.cmake', 'src/ros_portal/CMakeLists.txt') }}
          restore-keys: |
            livekit-sdk-${{ inputs.ros_distro }}-${{ inputs.arch }}-${{ inputs.ros_image_digest }}-${{ hashFiles('Dockerfile') }}-

      - name: Build packages
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          DEVCONTAINER_SSH_AUTH_SOCK: /tmp/devcontainer-empty-ssh-agent
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              set -u
              colcon build --packages-up-to ros_portal test_utilities custom_msgs
            '

      # The container writes as root; make only unreadable cache entries visible
      # to the runner before actions/cache archives them.
      - name: Make LiveKit SDK build cache readable
        if: >-
          env.BUILD_LIVEKIT_SDK_FROM_SOURCE == 'true'
          && github.event_name != 'pull_request'
          && steps.livekit_sdk_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for tree in \
            src/externals/client-sdk-cpp/client-sdk-rust/target \
            build/ros_portal/_deps
          do
            [[ -d "${tree}" ]] || continue
            sudo find "${tree}" -type f ! -perm -o=r -exec chmod a+r {} +
            sudo find "${tree}" -type d ! -perm -o=rx -exec chmod a+rx {} +
          done

      # Save before tests, and only from trusted runs that can populate a cache
      # reusable by pull requests.
      - name: Save LiveKit SDK build cache
        if: >-
          env.BUILD_LIVEKIT_SDK_FROM_SOURCE == 'true'
          && github.event_name != 'pull_request'
          && steps.livekit_sdk_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/externals/client-sdk-cpp/client-sdk-rust/target
            build/ros_portal/_deps
          key: livekit-sdk-${{ inputs.ros_distro }}-${{ inputs.arch }}-${{ inputs.ros_image_digest }}-${{ hashFiles('Dockerfile') }}-${{ hashFiles('external.repos', 'src/ros_portal/cmake/BuildLiveKitSDK.cmake', 'src/ros_portal/cmake/ConfigureLiveKitSDK.cmake', 'src/ros_portal/CMakeLists.txt') }}

      - name: "colcon test: unit"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u

              # --event-handlers console_direct+ streams test output live
              # --ctest-args -R ros_portal_unit_tests runs only the unit tests
              test_exit=0
              GTEST_COLOR=1 colcon test \
                --packages-up-to ros_portal test_utilities custom_msgs \
                --packages-skip ros2_medkit_serialization \
                --event-handlers console_direct+ \
                --return-code-on-test-failure \
                --ctest-args -R ros_portal_unit_tests \
                || test_exit=$?
              colcon test-result --verbose --all
              exit $test_exit
            '

      - name: Start livekit-server
        id: livekit_server
        uses: livekit/dev-server-action@6562d7d9343e46c26ead1223151f64f00e4fc37f # v1.1.0
        with:
          github-token: ${{ github.token }}
          version: v1.13.3
          config: |
            enable_participant_data_blob: true

      # Note: livekit-cli is not installed on the runner. The integration step
      # mints its tokens with `lk` from inside the devcontainer, where the image
      # already provides it, so installing it here only added a network
      # dependency that could fail the job (get.livekit.io has returned 403).

      - name: "colcon test: integration"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          CI: true
          GITHUB_TOKEN: ${{ github.token }}
          LIVEKIT_URL: ws://127.0.0.1:7880
          LIVEKIT_ROOM: ros_portal_test_room
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u

              source .token_helpers/set_test_tokens.bash

              # --event-handlers console_direct+ streams test output live
              # -R selects only the integration test
              test_exit=0
              GTEST_COLOR=1 colcon test \
                --packages-select ros_portal \
                --event-handlers console_direct+ \
                --return-code-on-test-failure \
                --ctest-args -R ros_portal_integration_tests \
                || test_exit=$?
              colcon test-result --verbose --all
              exit $test_exit
            '

      - name: Dump LiveKit server log on failure
        if: failure()
        run: tail -n 500 "${{ steps.livekit_server.outputs.log-path }}" || true

      # Package the install tree from the earlier colcon build. No rebuild or
      # SDK download — scripts/package-deb.sh only stages and bundles.
      - name: Package Debian
        id: debian_package
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          DEVCONTAINER_SSH_AUTH_SOCK: /tmp/devcontainer-empty-ssh-agent
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -euo pipefail
              exec ./scripts/package-deb.sh
            '

      # The runtime image installs the same Debian package into a clean ROS base
      # image, so this also preserves the clean-install package smoke test.
      - name: Build runtime Docker image
        shell: bash
        run: |
          set -euo pipefail
          deb_path="$(compgen -G 'artifacts/debian/*.deb')"
          docker build \
            --platform "linux/${{ inputs.arch }}" \
            --file docker/runtime/Dockerfile \
            --build-arg "DEB_FILE=${deb_path}" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" \
            --build-arg "IMAGE_SOURCE=https://github.com/${GITHUB_REPOSITORY}" \
            --build-arg "IMAGE_VERSION=ci-${GITHUB_SHA}" \
            --build-arg "ROS_DISTRO=${ROS_DISTRO}" \
            --build-arg "ROS_IMAGE_DIGEST=${ROS_IMAGE_DIGEST}" \
            --build-arg "ROS_IMAGE_REPOSITORY=${ROS_IMAGE_REPOSITORY}" \
            --build-arg "ROS_IMAGE_TAG=${ROS_IMAGE_TAG}" \
            --tag "${RUNTIME_IMAGE}" \
            .

      - name: Smoke-test runtime Docker image
        run: >-
          ./scripts/smoke-test-docker-image.sh
          "${RUNTIME_IMAGE}"
          "${ROS_DISTRO}"
          "${{ inputs.arch }}"

      - name: Upload Debian package
        # Preserve a built package for diagnosis when its clean-install smoke
        # test fails. Artifacts uploaded here appear on the workflow run summary.
        if: ${{ always() && !cancelled() && steps.debian_package.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ros-${{ inputs.ros_distro }}-livekit-portal-${{ inputs.arch }}-deb
          path: |
            artifacts/debian/*.deb
            artifacts/debian/*.sha256
          if-no-files-found: error
