name: Build

on:
  workflow_call:
    inputs:
      ros_distro: {required: true, type: string}
      arch: {required: true, type: string}
      os: {required: true, type: string}
      ros_image_tag: {required: true, type: string}
      ros_image_digest: {required: true, type: string}
      git_ref: {required: false, type: string}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      INSTALL_CPP_TOOLS: "false"
      INSTALL_SIMULATION_DEPS: "false"
      ROS_DISTRO: ${{ inputs.ros_distro }}
      ROS_IMAGE_DIGEST: ${{ inputs.ros_image_digest }}
      ROS_IMAGE_REPOSITORY: ros
      ROS_IMAGE_TAG: ${{ inputs.ros_image_tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.git_ref || github.sha }}
      - run: touch /tmp/devcontainer-empty-ssh-agent
      - name: Setup devcontainer environment
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: /bin/true
      - name: Build packages
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          DEVCONTAINER_SSH_AUTH_SOCK: /tmp/devcontainer-empty-ssh-agent
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              set -u
              colcon build --packages-up-to ros_portal test_utilities custom_msgs
            '
      - name: Archive colcon build output
        shell: bash
        run: |
          set -euo pipefail
          sudo tar --create --gzip --file /tmp/ros-build-output.tar.gz build install log
          sudo chown "$(id -u):$(id -g)" /tmp/ros-build-output.tar.gz
      - name: Upload colcon build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ros-${{ inputs.ros_distro }}-livekit-portal-${{ inputs.arch }}-build-output
          path: /tmp/ros-build-output.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
