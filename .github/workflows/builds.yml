name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-tools:
    name: C++ Tools
    uses: ./.github/workflows/cpp-tools.yml

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            ros_distro: humble
            ros_image_digest: afb40d6be65331c20a114d4e229a7ef099fed1b17bf6370daee193514b32aa16
            ros_image_tag: humble-ros-base-jammy
          - os: ubuntu-24.04-arm
            arch: arm64
            ros_distro: humble
            ros_image_digest: afb40d6be65331c20a114d4e229a7ef099fed1b17bf6370daee193514b32aa16
            ros_image_tag: humble-ros-base-jammy
          - os: ubuntu-24.04
            arch: amd64
            ros_distro: jazzy
            ros_image_digest: 31daab66eef9139933379fb67159449944f4e2dcf2e22c2d12cc715f29873e0f
            ros_image_tag: jazzy-ros-base-noble
          - os: ubuntu-24.04-arm
            arch: arm64
            ros_distro: jazzy
            ros_image_digest: 31daab66eef9139933379fb67159449944f4e2dcf2e22c2d12cc715f29873e0f
            ros_image_tag: jazzy-ros-base-noble
          - os: ubuntu-24.04
            arch: amd64
            ros_distro: kilted
            ros_image_digest: 5a91562b35fe8ce33082df7221ec564c0172ae9b242352a45562deb1ddbf2702
            ros_image_tag: kilted-ros-base-noble
          - os: ubuntu-24.04-arm
            arch: arm64
            ros_distro: kilted
            ros_image_digest: 5a91562b35fe8ce33082df7221ec564c0172ae9b242352a45562deb1ddbf2702
            ros_image_tag: kilted-ros-base-noble
          - os: ubuntu-24.04
            arch: amd64
            ros_distro: lyrical
            ros_image_digest: 728bd3a5acfb689b5c80d9ba13e35b0bddbf2219ec880071304237a11447fe7f
            ros_image_tag: lyrical-ros-base-resolute
          - os: ubuntu-24.04-arm
            arch: arm64
            ros_distro: lyrical
            ros_image_digest: 728bd3a5acfb689b5c80d9ba13e35b0bddbf2219ec880071304237a11447fe7f
            ros_image_tag: lyrical-ros-base-resolute

    name: Build and Tests (${{ matrix.ros_distro }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      BUILD_LIVEKIT_SDK_FROM_SOURCE: ${{ matrix.ros_distro == 'humble' && 'true' || 'false' }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      INSTALL_CPP_TOOLS: "false"
      INSTALL_SIMULATION_DEPS: "false"
      ROS_DISTRO: ${{ matrix.ros_distro }}
      ROS_IMAGE: ros:${{ matrix.ros_image_tag }}@sha256:${{ matrix.ros_image_digest }}
      ROS_IMAGE_DIGEST: ${{ matrix.ros_image_digest }}
      ROS_IMAGE_REPOSITORY: ros
      ROS_IMAGE_TAG: ${{ matrix.ros_image_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Prepare devcontainer SSH agent mount
        run: touch /tmp/devcontainer-empty-ssh-agent

      - name: Setup devcontainer environment
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never

      # Distributions whose runtime is too old for the prebuilt SDK archives
      # compile the pinned client-sdk-cpp checkout instead, which dominates their
      # job. Cache what that produces: the cargo target directory (Rust plus the
      # vendored WebRTC it unpacks) and the SDK's own CMake tree and install
      # prefix under the colcon build base.
      #
      # This must run after "Setup devcontainer environment", never before. That
      # step's postCreateCommand runs `vcs import --skip-existing`, and the cargo
      # target directory lives inside src/externals/client-sdk-cpp. Restoring
      # first would create that directory, vcs would skip cloning the SDK, and the
      # build would fail with no source to compile.
      #
      # The base image digest is part of the restore-key prefix so a fallback
      # match can never cross a toolchain change, which CMake would reject. Within
      # one image, cargo fingerprints and CMake handle a stale tree by rebuilding
      # what actually changed.
      - name: Restore LiveKit SDK build cache
        id: livekit_sdk_cache
        if: env.BUILD_LIVEKIT_SDK_FROM_SOURCE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/externals/client-sdk-cpp/client-sdk-rust/target
            build/ros2_livekit_bridge/_deps
          key: livekit-sdk-${{ matrix.ros_distro }}-${{ matrix.arch }}-${{ matrix.ros_image_digest }}-${{ hashFiles('external.repos', 'Dockerfile', 'src/ros2_livekit_bridge/cmake/BuildLiveKitSDK.cmake', 'src/ros2_livekit_bridge/CMakeLists.txt') }}
          restore-keys: |
            livekit-sdk-${{ matrix.ros_distro }}-${{ matrix.arch }}-${{ matrix.ros_image_digest }}-

      - name: Build packages
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          DEVCONTAINER_SSH_AUTH_SOCK: /tmp/devcontainer-empty-ssh-agent
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              set -u
              colcon build --packages-up-to ros2_livekit_bridge test_utilities custom_msgs
            '

      # The devcontainer writes these trees as root, but actions/cache tars them as
      # the unprivileged runner user, and the vendored WebRTC archive carries a few
      # mode-640 headers that tar would fail to read. Widen only what is too
      # narrow. chmod moves ctime, not mtime, so this cannot disturb the cargo and
      # make timestamps the whole cache depends on.
      - name: Make LiveKit SDK build cache readable
        if: >-
          env.BUILD_LIVEKIT_SDK_FROM_SOURCE == 'true'
          && github.event_name != 'pull_request'
          && steps.livekit_sdk_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for tree in \
            src/externals/client-sdk-cpp/client-sdk-rust/target \
            build/ros2_livekit_bridge/_deps
          do
            [[ -d "${tree}" ]] || continue
            sudo find "${tree}" -type f ! -perm -o=r -exec chmod a+r {} +
            sudo find "${tree}" -type d ! -perm -o=rx -exec chmod a+rx {} +
          done

      # Saved right after the build so a later test failure does not throw the SDK
      # away, and only on non-pull-request events. A pull request's cache writes
      # are scoped to that pull request and unusable by any other, so letting every
      # pull request store a multi-gigabyte entry would just evict the shared entry
      # they all read from. Pull requests restore from the base branch instead.
      - name: Save LiveKit SDK build cache
        if: >-
          env.BUILD_LIVEKIT_SDK_FROM_SOURCE == 'true'
          && github.event_name != 'pull_request'
          && steps.livekit_sdk_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/externals/client-sdk-cpp/client-sdk-rust/target
            build/ros2_livekit_bridge/_deps
          key: livekit-sdk-${{ matrix.ros_distro }}-${{ matrix.arch }}-${{ matrix.ros_image_digest }}-${{ hashFiles('external.repos', 'Dockerfile', 'src/ros2_livekit_bridge/cmake/BuildLiveKitSDK.cmake', 'src/ros2_livekit_bridge/CMakeLists.txt') }}

      - name: "colcon test: unit"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u

              # --event-handlers console_direct+ streams test output live
              # --ctest-args -R ros2_livekit_bridge_unit_tests runs only the unit tests
              test_exit=0
              GTEST_COLOR=1 colcon test \
                --packages-up-to ros2_livekit_bridge test_utilities custom_msgs \
                --packages-skip ros2_medkit_serialization \
                --event-handlers console_direct+ \
                --return-code-on-test-failure \
                --ctest-args -R ros2_livekit_bridge_unit_tests \
                || test_exit=$?
              colcon test-result --verbose --all
              exit $test_exit
            '

      - name: Start livekit-server
        id: livekit_server
        uses: livekit/dev-server-action@6562d7d9343e46c26ead1223151f64f00e4fc37f # v1.1.0
        with:
          github-token: ${{ github.token }}
          version: v1.13.3
          config: |
            enable_participant_data_blob: true

      # Note: livekit-cli is not installed on the runner. The integration step
      # mints its tokens with `lk` from inside the devcontainer, where the image
      # already provides it, so installing it here only added a network
      # dependency that could fail the job (get.livekit.io has returned 403).

      - name: "colcon test: integration"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          CI: true
          GITHUB_TOKEN: ${{ github.token }}
          LIVEKIT_URL: ws://127.0.0.1:7880
          LIVEKIT_ROOM: ros2_livekit_bridge_test_room
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u

              source .token_helpers/set_test_tokens.bash

              # --event-handlers console_direct+ streams test output live
              # -R selects only the integration test
              test_exit=0
              GTEST_COLOR=1 colcon test \
                --packages-select ros2_livekit_bridge \
                --event-handlers console_direct+ \
                --return-code-on-test-failure \
                --ctest-args -R ros2_livekit_bridge_integration_tests \
                || test_exit=$?
              colcon test-result --verbose --all
              exit $test_exit
            '

      - name: Dump LiveKit server log on failure
        if: failure()
        run: tail -n 500 "${{ steps.livekit_server.outputs.log-path }}" || true

      # Packaging is skipped on pull requests: build-deb.sh builds into a clean
      # tree, which on Humble means compiling the LiveKit SDK a second time in
      # the same job (~13 min of the ~47 min job; the SDK's Rust output is reused
      # from the source tree but its C++ tree lives under the build base and is
      # rebuilt). Debian Release consumes the deb-* artifacts from a CI run whose
      # head SHA matches the release tag, so push-to-main and workflow_dispatch
      # runs -- which still package -- remain the only usable release sources.
      # A pull request run never satisfied that check.
      - name: Build Debian package
        if: github.event_name != 'pull_request'
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          DEVCONTAINER_SSH_AUTH_SOCK: /tmp/devcontainer-empty-ssh-agent
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: ./scripts/build-deb.sh

      - name: Smoke-test clean installation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          deb_path="$(compgen -G 'artifacts/debian/*.deb')"
          docker run --rm \
            --env "ROS_DISTRO=${ROS_DISTRO}" \
            --volume "${PWD}/artifacts/debian:/packages:ro" \
            --volume "${PWD}/scripts/smoke-test-deb.sh:/smoke-test-deb.sh:ro" \
            "${ROS_IMAGE}" \
            bash -lc "/smoke-test-deb.sh /packages/$(basename "${deb_path}")"

      - name: Upload Debian package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ matrix.ros_distro }}-${{ matrix.arch }}
          path: |
            artifacts/debian/*.deb
            artifacts/debian/*.sha256
          if-no-files-found: error
