name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Unit, and Integration Tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build ros2_livekit_bridge in devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source /opt/ros/jazzy/setup.bash
              set -u
              mkdir -p src/externals
              if [ -f external.repos ]; then
                vcs import --skip-existing src/externals < external.repos
              fi
              rosdep update
              rosdep install --from-paths src/ros2_livekit_bridge --ignore-src -r -y
              colcon build --packages-up-to ros2_livekit_bridge
            '

      - name: Run unit tests
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source /opt/ros/jazzy/setup.bash
              source install/setup.bash
              set -u

              test -x build/ros2_livekit_bridge/ros2_livekit_bridge_unit_tests
              GTEST_COLOR=1 build/ros2_livekit_bridge/ros2_livekit_bridge_unit_tests
            '

      - name: Install LiveKit server
        run: |
          set -euxo pipefail
          livekit_version="1.12.0"
          case "$(uname -m)" in
            x86_64) livekit_arch="amd64" ;;
            aarch64 | arm64) livekit_arch="arm64" ;;
            *) echo "::error::unsupported LiveKit server architecture: $(uname -m)"; exit 1 ;;
          esac

          archive="livekit_${livekit_version}_linux_${livekit_arch}.tar.gz"
          url="https://github.com/livekit/livekit/releases/download/v${livekit_version}/${archive}"
          install_dir="$(mktemp -d)"
          curl -fsSL "$url" -o "${install_dir}/${archive}"
          tar -xzf "${install_dir}/${archive}" -C "$install_dir"

          livekit_binary="$(find "$install_dir" -type f -name livekit-server -perm -111 | head -n 1)"
          if [ -z "$livekit_binary" ]; then
            echo "::error::livekit-server binary not found in ${archive}"
            find "$install_dir" -maxdepth 3 -type f
            exit 1
          fi

          sudo install -m 0755 "$livekit_binary" /usr/local/bin/livekit-server
          livekit-server --version

      - name: Start LiveKit server
        env:
          LIVEKIT_CONFIG: "enable_data_tracks: true"
        run: |
          set -euxo pipefail
          nohup livekit-server --dev > livekit-server.log 2>&1 &
          echo $! > livekit-server.pid

          for _ in {1..30}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/7880' >/dev/null 2>&1; then
              echo "livekit-server is ready"
              exit 0
            fi
            sleep 1
          done

          echo "::error::livekit-server failed to start within 30s"
          tail -n 200 livekit-server.log || true
          exit 1

      - name: Run integration tests
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIVEKIT_URL: ws://127.0.0.1:7880
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source /opt/ros/jazzy/setup.bash
              source install/setup.bash
              set -u

              eval "$(bash src/ros2_livekit_bridge/test/token_helpers/set_bridge_integration_tokens.bash)"
              test -x build/ros2_livekit_bridge/ros2_livekit_bridge_integration_tests
              GTEST_COLOR=1 build/ros2_livekit_bridge/ros2_livekit_bridge_integration_tests
            '

      - name: Stop LiveKit server
        if: always()
        run: |
          if [ -f livekit-server.pid ]; then
            kill "$(cat livekit-server.pid)" 2>/dev/null || true
            rm -f livekit-server.pid
          fi

      - name: Dump LiveKit server log on failure
        if: failure()
        run: tail -n 500 livekit-server.log || true
