name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ros2-livekit-bridge
  WS_ROS: livekit_ws

jobs:
  build-and-test:
    name: Build and Unit Tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Compute Docker image metadata
        id: image
        uses: ./.github/actions/docker-image-metadata
        with:
          image-name: ${{ env.IMAGE_NAME }}
          arch: ${{ matrix.arch }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Check for architecture-tagged image
        id: remote_image
        run: |
          if docker buildx imagetools inspect "${{ steps.image.outputs.arch_ref }}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Pull existing image
        if: steps.remote_image.outputs.exists == 'true'
        run: |
          docker pull --platform "${{ matrix.platform }}" "${{ steps.image.outputs.arch_ref }}"
          docker tag "${{ steps.image.outputs.arch_ref }}" "${{ steps.image.outputs.local_ref }}"

      - name: Build image with cache export
        if: steps.remote_image.outputs.exists != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          build-args: |
            WS_ROS=${{ env.WS_ROS }}
          tags: |
            ${{ steps.image.outputs.local_ref }}
            ${{ steps.image.outputs.arch_ref }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Build image
        if: steps.remote_image.outputs.exists != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          build-args: |
            WS_ROS=${{ env.WS_ROS }}
          tags: |
            ${{ steps.image.outputs.local_ref }}
            ${{ steps.image.outputs.arch_ref }}
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Build and test ROS 2 packages in container
        run: |
          docker run --rm \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -v "${GITHUB_WORKSPACE}:/${WS_ROS}" \
            -w "/${WS_ROS}" \
            "${{ steps.image.outputs.local_ref }}" \
            bash -lc '
              set -eo pipefail
              source /opt/ros/jazzy/setup.bash
              set -u
              mkdir -p src/externals
              if [ -f external.repos ]; then
                vcs import --skip-existing src/externals < external.repos
              fi
              rosdep update
              rosdep install --from-paths src/ros2_livekit_bridge --ignore-src -r -y
              colcon build --packages-up-to ros2_livekit_bridge

              # Run non-LiveKit-server tests here to avoid a rebuild.
              colcon test --packages-select ros2_livekit_bridge \
                --ctest-args -E ros2_livekit_bridge_integration_tests
              colcon test-result --verbose
            '
        # TODO: add lint stage

      - name: Install LiveKit server
        run: |
          set -euxo pipefail
          livekit_version="1.12.0"
          case "$(uname -m)" in
            x86_64) livekit_arch="amd64" ;;
            aarch64 | arm64) livekit_arch="arm64" ;;
            *) echo "::error::unsupported LiveKit server architecture: $(uname -m)"; exit 1 ;;
          esac

          archive="livekit_${livekit_version}_linux_${livekit_arch}.tar.gz"
          url="https://github.com/livekit/livekit/releases/download/v${livekit_version}/${archive}"
          install_dir="$(mktemp -d)"
          curl -fsSL "$url" -o "${install_dir}/${archive}"
          tar -xzf "${install_dir}/${archive}" -C "$install_dir"

          livekit_binary="$(find "$install_dir" -type f -name livekit-server -perm -111 | head -n 1)"
          if [ -z "$livekit_binary" ]; then
            echo "::error::livekit-server binary not found in ${archive}"
            find "$install_dir" -maxdepth 3 -type f
            exit 1
          fi

          sudo install -m 0755 "$livekit_binary" /usr/local/bin/livekit-server
          livekit-server --version

      - name: Start LiveKit server
        env:
          LIVEKIT_CONFIG: "enable_data_tracks: true"
        run: |
          set -euxo pipefail
          nohup livekit-server --dev > livekit-server.log 2>&1 &
          echo $! > livekit-server.pid

          for _ in {1..30}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/7880' >/dev/null 2>&1; then
              echo "livekit-server is ready"
              exit 0
            fi
            sleep 1
          done

          echo "::error::livekit-server failed to start within 30s"
          tail -n 200 livekit-server.log || true
          exit 1

      - name: Run LiveKit integration tests in container
        run: |
          docker run --rm \
            --network host \
            -e GITHUB_TOKEN="${{ github.token }}" \
            -e LIVEKIT_URL="ws://127.0.0.1:7880" \
            -v "${GITHUB_WORKSPACE}:/${WS_ROS}" \
            -w "/${WS_ROS}" \
            "${{ steps.image.outputs.local_ref }}" \
            bash -lc '
              set -eo pipefail
              source /opt/ros/jazzy/setup.bash
              source install/setup.bash
              set -u

              eval "$(bash src/ros2_livekit_bridge/test/token_helpers/set_bridge_integration_tokens.bash)"
              colcon test --packages-select ros2_livekit_bridge \
                --ctest-args -R ros2_livekit_bridge_integration_tests
              colcon test-result --verbose
            '

      - name: Stop LiveKit server
        if: always()
        run: |
          if [ -f livekit-server.pid ]; then
            kill "$(cat livekit-server.pid)" 2>/dev/null || true
            rm -f livekit-server.pid
          fi

      - name: Dump LiveKit server log on failure
        if: failure()
        run: tail -n 500 livekit-server.log || true

  push-architecture-images:
    name: Push Architecture Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Compute Docker image metadata
        id: image
        uses: ./.github/actions/docker-image-metadata
        with:
          image-name: ${{ env.IMAGE_NAME }}
          arch: ${{ matrix.arch }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Check for architecture-tagged image
        id: remote_image
        run: |
          if docker buildx imagetools inspect "${{ steps.image.outputs.arch_ref }}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push architecture image
        if: steps.remote_image.outputs.exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            WS_ROS=${{ env.WS_ROS }}
          tags: |
            ${{ steps.image.outputs.arch_ref }}
          cache-from: type=gha,scope=${{ matrix.arch }}

  publish-image:
    name: Publish Docker image
    runs-on: ubuntu-24.04
    needs: push-architecture-images
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Compute Docker image metadata
        id: image
        uses: ./.github/actions/docker-image-metadata
        with:
          image-name: ${{ env.IMAGE_NAME }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Check for Docker image manifest
        id: remote_image
        run: |
          if docker buildx imagetools inspect "${{ steps.image.outputs.image_ref }}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Push multi-architecture Docker image manifest
        if: steps.remote_image.outputs.exists != 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.image_ref }}" \
            "${{ steps.image.outputs.x64_ref }}" \
            "${{ steps.image.outputs.aarch64_ref }}"
