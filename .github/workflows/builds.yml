name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Devcontainer CI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: macos-26-xlarge
            name: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Docker on macOS
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install docker colima
          colima start --arch aarch64 --cpu 4 --memory 8 --disk 40
          docker version

      - name: Build and test in devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source /opt/ros/jazzy/setup.bash
              set -u
              mkdir -p src/externals
              if [ -f external.repos ]; then
                vcs import --skip-existing src/externals < external.repos
              fi
              rosdep update
              rosdep install --from-paths src/ros2_livekit_bridge --ignore-src -r -y
              colcon build --packages-up-to ros2_livekit_bridge

              # test here to avoid a rebuild
              colcon test --packages-select ros2_livekit_bridge --ctest-args -E "^livekit_connect_node_test$"
              colcon test-result --verbose
            '
        # TODO: add lint stage
        # TODO: add integration test stage
