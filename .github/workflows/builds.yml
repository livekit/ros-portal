name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-tools:
    name: C++ Tools
    uses: ./.github/workflows/cpp-tools.yml

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            ros_distro: humble
            ros_image_digest: afb40d6be65331c20a114d4e229a7ef099fed1b17bf6370daee193514b32aa16
            ros_image_tag: humble-ros-base-jammy
          - os: ubuntu-24.04-arm
            arch: arm64
            ros_distro: humble
            ros_image_digest: afb40d6be65331c20a114d4e229a7ef099fed1b17bf6370daee193514b32aa16
            ros_image_tag: humble-ros-base-jammy
          - os: ubuntu-24.04
            arch: amd64
            ros_distro: jazzy
            ros_image_digest: 31daab66eef9139933379fb67159449944f4e2dcf2e22c2d12cc715f29873e0f
            ros_image_tag: jazzy-ros-base-noble
          - os: ubuntu-24.04-arm
            arch: arm64
            ros_distro: jazzy
            ros_image_digest: 31daab66eef9139933379fb67159449944f4e2dcf2e22c2d12cc715f29873e0f
            ros_image_tag: jazzy-ros-base-noble
          - os: ubuntu-24.04
            arch: amd64
            ros_distro: kilted
            ros_image_digest: 5a91562b35fe8ce33082df7221ec564c0172ae9b242352a45562deb1ddbf2702
            ros_image_tag: kilted-ros-base-noble
          - os: ubuntu-24.04-arm
            arch: arm64
            ros_distro: kilted
            ros_image_digest: 5a91562b35fe8ce33082df7221ec564c0172ae9b242352a45562deb1ddbf2702
            ros_image_tag: kilted-ros-base-noble
          - os: ubuntu-24.04
            arch: amd64
            ros_distro: lyrical
            ros_image_digest: 728bd3a5acfb689b5c80d9ba13e35b0bddbf2219ec880071304237a11447fe7f
            ros_image_tag: lyrical-ros-base-resolute
          - os: ubuntu-24.04-arm
            arch: arm64
            ros_distro: lyrical
            ros_image_digest: 728bd3a5acfb689b5c80d9ba13e35b0bddbf2219ec880071304237a11447fe7f
            ros_image_tag: lyrical-ros-base-resolute

    name: Build and Tests (${{ matrix.ros_distro }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      BUILD_LIVEKIT_SDK_FROM_SOURCE: ${{ matrix.ros_distro == 'humble' && 'true' || 'false' }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      INSTALL_CPP_TOOLS: "false"
      INSTALL_SIMULATION_DEPS: "false"
      ROS_DISTRO: ${{ matrix.ros_distro }}
      ROS_IMAGE_DIGEST: ${{ matrix.ros_image_digest }}
      ROS_IMAGE_REPOSITORY: ros
      ROS_IMAGE_TAG: ${{ matrix.ros_image_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Prepare devcontainer SSH agent mount
        run: touch /tmp/devcontainer-empty-ssh-agent

      - name: Setup devcontainer environment
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never

      - name: Build packages
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          DEVCONTAINER_SSH_AUTH_SOCK: /tmp/devcontainer-empty-ssh-agent
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              set -u
              # target specific packages to avoid unneeded/wanted dependencies
              colcon build --packages-up-to ros2_livekit_bridge test_utilities custom_msgs waveshare_launch
            '

      - name: "colcon test: unit"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u

              # --event-handlers console_direct+ streams test output live
              # --ctest-args -R ros2_livekit_bridge_unit_tests runs only the unit tests
              test_exit=0
              GTEST_COLOR=1 colcon test \
                --packages-up-to ros2_livekit_bridge test_utilities custom_msgs waveshare_launch \
                --packages-skip ros2_medkit_serialization \
                --event-handlers console_direct+ \
                --return-code-on-test-failure \
                --ctest-args -R ros2_livekit_bridge_unit_tests \
                || test_exit=$?
              colcon test-result --verbose --all
              exit $test_exit
            '

      - name: Start livekit-server
        id: livekit_server
        uses: livekit/dev-server-action@6562d7d9343e46c26ead1223151f64f00e4fc37f # v1.1.0
        with:
          github-token: ${{ github.token }}
          version: v1.13.3
          config: |
            enable_participant_data_blob: true

      - name: Install livekit-cli
        run: |
          set -euxo pipefail
          curl -sSL https://get.livekit.io/cli | bash
          lk --version

      - name: "colcon test: integration"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          CI: true
          GITHUB_TOKEN: ${{ github.token }}
          LIVEKIT_URL: ws://127.0.0.1:7880
          LIVEKIT_ROOM: ros2_livekit_bridge_test_room
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u

              source .token_helpers/set_test_tokens.bash

              # --event-handlers console_direct+ streams test output live
              # -R selects only the integration test
              test_exit=0
              GTEST_COLOR=1 colcon test \
                --packages-select ros2_livekit_bridge \
                --event-handlers console_direct+ \
                --return-code-on-test-failure \
                --ctest-args -R ros2_livekit_bridge_integration_tests \
                || test_exit=$?
              colcon test-result --verbose --all
              exit $test_exit
            '

      - name: Dump LiveKit server log on failure
        if: failure()
        run: tail -n 500 "${{ steps.livekit_server.outputs.log-path }}" || true
