name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-tools:
    name: C++ Tools
    # Keep this immutable ref aligned with the cpp-tools submodule gitlink.
    uses: livekit/cpp-tools/.github/workflows/cpp-tools.yml@d0934bbfb57ae927ccb83a3a830059407fe7055c
    with:
      clang_format: true
      clang_tidy: true
      clang_tidy_fail_on_warning: false
      checkout_submodules: recursive
      clang_format_paths: src/ros2_livekit_bridge src/ros2_livekit_bridge_config
      clang_tidy_dependencies_command: |
        sudo apt-get update
        sudo apt-get install -y \
          ca-certificates curl gnupg software-properties-common wget
        sudo add-apt-repository -y universe
        sudo curl -sSL \
          https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
          -o /usr/share/keyrings/ros-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo "${UBUNTU_CODENAME}") main" \
          | sudo tee /etc/apt/sources.list.d/ros2.list >/dev/null
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang cmake jq libclang-dev libcurl4-openssl-dev \
          libssl-dev llvm-dev ninja-build pkg-config \
          python3-colcon-common-extensions python3-rosdep python3-vcstool \
          ros-jazzy-ros-base
        if [[ ! -e /etc/ros/rosdep/sources.list.d/20-default.list ]]; then
          sudo rosdep init
        fi
        rosdep update --rosdistro jazzy
        mkdir -p src/externals
        vcs import --skip-existing src/externals < external.repos
        rosdep install \
          --from-paths \
            src/ros2_livekit_bridge \
            src/ros2_livekit_bridge_config \
            src/ros2_livekit_bridge_msgs \
            src/externals/ros2_medkit/src/ros2_medkit_cmake \
            src/externals/ros2_medkit/src/ros2_medkit_serialization \
          --ignore-src -r -y --rosdistro jazzy \
          --skip-keys ament_cmake_clang_tidy
      clang_tidy_configure_command: |
        set +u
        source /opt/ros/jazzy/setup.bash
        set -u
        colcon build \
          --packages-up-to ros2_livekit_bridge \
          --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTING=OFF
        jq -s 'add' build/*/compile_commands.json > build/compile_commands.json
      clang_tidy_build_dir: build
      clang_tidy_file_regex: '^.*/src/(ros2_livekit_bridge|ros2_livekit_bridge_config)/src/.*\.(c|cc|cpp|cxx)$'
      clang_tidy_header_filter: '^.*/src/(ros2_livekit_bridge|ros2_livekit_bridge_config)/(include|src)/.*\.(h|hh|hpp|hxx)$'
      clang_tidy_exclude_header_filter: '(.*/test/.*)|(.*/build/.*)|(.*/install/.*)|(.*/src/externals/.*)'

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64

    name: Build and Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: recursive

      - name: Prepare devcontainer SSH agent mount
        run: touch /tmp/devcontainer-empty-ssh-agent

      - name: Setup devcontainer environment
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never

      - name: Build packages
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          DEVCONTAINER_SSH_AUTH_SOCK: /tmp/devcontainer-empty-ssh-agent
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source /opt/ros/jazzy/setup.bash
              set -u
              # target specific packages to avoid unneeded/wanted dependencies
              colcon build --packages-up-to ros2_livekit_bridge test_utilities custom_msgs waveshare_launch
            '

      - name: Run unit tests
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source /opt/ros/jazzy/setup.bash
              source install/setup.bash
              set -u

              test -x build/ros2_livekit_bridge/test/ros2_livekit_bridge_unit_tests
              GTEST_COLOR=1 build/ros2_livekit_bridge/test/ros2_livekit_bridge_unit_tests
            '

      - name: Start livekit-server
        id: livekit_server
        uses: livekit/dev-server-action@61e2b4dcb170dd3591e0c9b0db3c3fe5db93b500
        with:
          github-token: ${{ github.token }}

      - name: Install livekit-cli
        run: |
          set -euxo pipefail
          curl -sSL https://get.livekit.io/cli | bash
          lk --version

      - name: Run integration tests
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          CI: true
          GITHUB_TOKEN: ${{ github.token }}
          LIVEKIT_URL: ws://127.0.0.1:7880
          LIVEKIT_ROOM: ros_bridge_participant_id_test
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source /opt/ros/jazzy/setup.bash
              source install/setup.bash
              set -u

              source .token_helpers/set_test_tokens.bash
              test -x build/ros2_livekit_bridge/test/ros2_livekit_bridge_integration_tests
              GTEST_COLOR=1 build/ros2_livekit_bridge/test/ros2_livekit_bridge_integration_tests
            '

      - name: Dump LiveKit server log on failure
        if: failure()
        run: tail -n 500 "${{ steps.livekit_server.outputs.log-path }}" || true
