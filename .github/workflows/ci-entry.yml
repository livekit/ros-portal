name: CI Matrix Entry

on:
  workflow_call:
    inputs:
      ros_distro: {required: true, type: string}
      arch: {required: true, type: string}
      os: {required: true, type: string}
      ros_image_tag: {required: true, type: string}
      ros_image_digest: {required: true, type: string}
      git_ref: {required: false, type: string}
      test_repetitions:
        description: Number of successful executions required for each selected CTest test
        required: false
        default: 1
        type: number
      test_timeout_minutes:
        description: Maximum duration of the test job in minutes
        required: false
        default: 90
        type: number
      run_package:
        description: Whether to build the Debian package after tests pass
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ros_distro: ${{ inputs.ros_distro }}
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      ros_image_tag: ${{ inputs.ros_image_tag }}
      ros_image_digest: ${{ inputs.ros_image_digest }}
      git_ref: ${{ inputs.git_ref }}
    secrets: inherit

  test:
    needs: build
    uses: ./.github/workflows/tests.yml
    with:
      ros_distro: ${{ inputs.ros_distro }}
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      ros_image_tag: ${{ inputs.ros_image_tag }}
      ros_image_digest: ${{ inputs.ros_image_digest }}
      git_ref: ${{ inputs.git_ref }}
      test_repetitions: ${{ inputs.test_repetitions }}
      timeout_minutes: ${{ inputs.test_timeout_minutes }}
    secrets: inherit

  package:
    needs:
      - build
      - test
    if: ${{ inputs.run_package }}
    uses: ./.github/workflows/package.yml
    with:
      ros_distro: ${{ inputs.ros_distro }}
      arch: ${{ inputs.arch }}
      os: ${{ inputs.os }}
      ros_image_tag: ${{ inputs.ros_image_tag }}
      ros_image_digest: ${{ inputs.ros_image_digest }}
      git_ref: ${{ inputs.git_ref }}
    secrets: inherit
