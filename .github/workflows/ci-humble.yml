name: Humble

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    uses: ./.github/workflows/build-and-test.yml
    with:
      ros_distro: humble
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      ros_image_tag: humble-ros-base-jammy
      ros_image_digest: afb40d6be65331c20a114d4e229a7ef099fed1b17bf6370daee193514b32aa16
    secrets: inherit
