name: Jazzy

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    uses: ./.github/workflows/build-and-test.yml
    with:
      ros_distro: jazzy
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      ros_image_tag: jazzy-ros-base-noble
      ros_image_digest: 31daab66eef9139933379fb67159449944f4e2dcf2e22c2d12cc715f29873e0f
    secrets: inherit
