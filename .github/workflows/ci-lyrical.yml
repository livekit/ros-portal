name: Lyrical

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    uses: ./.github/workflows/build-and-test.yml
    with:
      ros_distro: lyrical
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      ros_image_tag: lyrical-ros-base-resolute
      ros_image_digest: 728bd3a5acfb689b5c80d9ba13e35b0bddbf2219ec880071304237a11447fe7f
    secrets: inherit
