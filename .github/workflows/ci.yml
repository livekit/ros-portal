name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-release-check:
    name: SDK Release Check
    uses: ./.github/workflows/sdk-release-check.yml

  cpp-tools:
    name: C++ Tools
    uses: ./.github/workflows/cpp-tools.yml

  humble:
    name: Humble
    uses: ./.github/workflows/ci-humble.yml
    secrets: inherit

  jazzy:
    name: Jazzy
    uses: ./.github/workflows/ci-jazzy.yml
    secrets: inherit

  kilted:
    name: Kilted
    uses: ./.github/workflows/ci-kilted.yml
    secrets: inherit

  lyrical:
    name: Lyrical
    uses: ./.github/workflows/ci-lyrical.yml
    secrets: inherit

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - sdk-release-check
      - cpp-tools
      - humble
      - jazzy
      - kilted
      - lyrical
    if: always()
    steps:
      - name: Verify required CI jobs
        uses: suzuki-shunsuke/required-status-check-action@2b5a46064846b09381852c2c4217e898f639e768  # v0.1.3
        with:
          needs: ${{ toJson(needs) }}
