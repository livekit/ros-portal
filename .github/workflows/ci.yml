name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-release-check:
    name: SDK Release Check
    uses: ./.github/workflows/sdk-release-check.yml

  cpp-tools:
    name: C++ Tools
    uses: ./.github/workflows/cpp-tools.yml

  ros-build-matrix:
    name: Load ROS Build Matrix
    uses: ./.github/workflows/ros-build-matrix.yml

  # Build, test, package each ROS distribution and architecture combination
  ci-entries:
    name: ${{ matrix.ros_distro }} (${{ matrix.arch }})${{ matrix.ros_distro }}, ${{ matrix.arch }})
    needs: ros-build-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ros-build-matrix.outputs.matrix) }}
    uses: ./.github/workflows/ci-entry.yml
    with:
      ros_distro: ${{ matrix.ros_distro }}
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      ros_image_tag: ${{ matrix.ros_image_tag }}
      ros_image_digest: ${{ matrix.ros_image_digest }}
    secrets: inherit

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - sdk-release-check
      - cpp-tools
      - ros-build-matrix
      - build
    if: always()
    steps:
      - name: Verify required CI jobs
        uses: suzuki-shunsuke/required-status-check-action@2b5a46064846b09381852c2c4217e898f639e768  # v0.1.3
        with:
          needs: ${{ toJson(needs) }}
