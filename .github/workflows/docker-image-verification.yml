name: Docker Image Verification

on:
  schedule:
    - cron: "23 9 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-verification
  cancel-in-progress: true

env:
  IMAGE_NAME: docker.io/livekit/ros-portal

jobs:
  verify-manifests:
    name: Manifest (${{ matrix.ros_distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ros_distro:
          - humble
          - jazzy
          - kilted
          - lyrical
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify multi-architecture image
        run: >-
          ./scripts/verify-multiarch-image.sh
          "${IMAGE_NAME}:${{ matrix.ros_distro }}"

  smoke-test:
    name: Smoke Test (${{ matrix.ros_distro }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            arch: amd64
            os: ubuntu-24.04
          - ros_distro: humble
            arch: arm64
            os: ubuntu-24.04-arm
          - ros_distro: jazzy
            arch: amd64
            os: ubuntu-24.04
          - ros_distro: jazzy
            arch: arm64
            os: ubuntu-24.04-arm
          - ros_distro: kilted
            arch: amd64
            os: ubuntu-24.04
          - ros_distro: kilted
            arch: arm64
            os: ubuntu-24.04-arm
          - ros_distro: lyrical
            arch: amd64
            os: ubuntu-24.04
          - ros_distro: lyrical
            arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull image
        run: >-
          docker pull
          --platform "linux/${{ matrix.arch }}"
          "${IMAGE_NAME}:${{ matrix.ros_distro }}"

      - name: Smoke-test image
        run: >-
          ./scripts/smoke-test-docker-image.sh
          "${IMAGE_NAME}:${{ matrix.ros_distro }}"
          "${{ matrix.ros_distro }}"
          "${{ matrix.arch }}"
