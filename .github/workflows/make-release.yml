name: Release Debian Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release without a leading v (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: debian-release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${DISPATCH_VERSION}" ]]; then
            version="${DISPATCH_VERSION}"
          elif [[ "${REF_TYPE}" == "tag" ]]; then
            version="${REF_NAME#v}"
          else
            echo "Unable to derive a release version" >&2
            exit 1
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must have the form X.Y.Z without a leading v: ${version}" >&2
            exit 1
          fi

          mapfile -t package_versions < <(
            python3 - \
              src/ros_portal/package.xml \
              src/ros_portal_config/package.xml \
              src/ros_portal_msgs/package.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          for package_xml in sys.argv[1:]:
              print(ET.parse(package_xml).getroot().findtext("version"))
          PY
          )

          if [[ "${#package_versions[@]}" -ne 3 ]]; then
            echo "Unable to read every first-party package version" >&2
            exit 1
          fi
          for package_version in "${package_versions[@]}"; do
            if [[ "${package_version}" != "${version}" ]]; then
              echo "Release version ${version} does not match package.xml version ${package_version}" >&2
              exit 1
            fi
          done

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${version}"

  build:
    name: Build, Test, Package (${{ matrix.ros_distro }}, ${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            arch: amd64
            os: ubuntu-24.04
            ros_image_tag: humble-ros-base-jammy
            ros_image_digest: afb40d6be65331c20a114d4e229a7ef099fed1b17bf6370daee193514b32aa16
          - ros_distro: humble
            arch: arm64
            os: ubuntu-24.04-arm
            ros_image_tag: humble-ros-base-jammy
            ros_image_digest: afb40d6be65331c20a114d4e229a7ef099fed1b17bf6370daee193514b32aa16
          - ros_distro: jazzy
            arch: amd64
            os: ubuntu-24.04
            ros_image_tag: jazzy-ros-base-noble
            ros_image_digest: 31daab66eef9139933379fb67159449944f4e2dcf2e22c2d12cc715f29873e0f
          - ros_distro: jazzy
            arch: arm64
            os: ubuntu-24.04-arm
            ros_image_tag: jazzy-ros-base-noble
            ros_image_digest: 31daab66eef9139933379fb67159449944f4e2dcf2e22c2d12cc715f29873e0f
          - ros_distro: kilted
            arch: amd64
            os: ubuntu-24.04
            ros_image_tag: kilted-ros-base-noble
            ros_image_digest: 5a91562b35fe8ce33082df7221ec564c0172ae9b242352a45562deb1ddbf2702
          - ros_distro: kilted
            arch: arm64
            os: ubuntu-24.04-arm
            ros_image_tag: kilted-ros-base-noble
            ros_image_digest: 5a91562b35fe8ce33082df7221ec564c0172ae9b242352a45562deb1ddbf2702
          - ros_distro: lyrical
            arch: amd64
            os: ubuntu-24.04
            ros_image_tag: lyrical-ros-base-resolute
            ros_image_digest: 728bd3a5acfb689b5c80d9ba13e35b0bddbf2219ec880071304237a11447fe7f
          - ros_distro: lyrical
            arch: arm64
            os: ubuntu-24.04-arm
            ros_image_tag: lyrical-ros-base-resolute
            ros_image_digest: 728bd3a5acfb689b5c80d9ba13e35b0bddbf2219ec880071304237a11447fe7f
    permissions:
      contents: read
    uses: ./.github/workflows/build-and-test.yml
    with:
      ros_distro: ${{ matrix.ros_distro }}
      arch: ${{ matrix.arch }}
      os: ${{ matrix.os }}
      ros_image_tag: ${{ matrix.ros_image_tag }}
      ros_image_digest: ${{ matrix.ros_image_digest }}
    secrets: inherit

  release:
    name: Create GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Debian packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: ros-*-livekit-portal-*-deb
          merge-multiple: true

      - name: Verify release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          for ros_distro in humble jazzy kilted lyrical; do
            for arch in amd64 arm64; do
              deb="release-assets/ros-${ros_distro}-livekit-portal_${VERSION}-1_${arch}.deb"
              checksum="${deb}.sha256"
              if [[ ! -f "${deb}" || ! -f "${checksum}" ]]; then
                echo "Missing release assets for ROS ${ros_distro} ${arch}" >&2
                exit 1
              fi
            done
          done

          mapfile -t debs < <(find release-assets -maxdepth 1 -type f -name '*.deb' -print)
          mapfile -t checksums < <(find release-assets -maxdepth 1 -type f -name '*.deb.sha256' -print)
          if [[ "${#debs[@]}" -ne 8 || "${#checksums[@]}" -ne 8 ]]; then
            echo "Expected 8 Debian packages and 8 checksums" >&2
            exit 1
          fi

          (
            cd release-assets
            sha256sum --check ./*.deb.sha256
          )

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ROS Portal v${{ needs.validate.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.deb
            release-assets/*.deb.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}
