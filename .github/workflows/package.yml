name: Package

on:
  workflow_call:
    inputs:
      ros_distro: {required: true, type: string}
      arch: {required: true, type: string}
      os: {required: true, type: string}
      ros_image_tag: {required: true, type: string}
      ros_image_digest: {required: true, type: string}
      git_ref: {required: false, type: string}

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    env:
      BUILD_LIVEKIT_SDK_FROM_SOURCE: ${{ inputs.ros_distro == 'humble' && 'true' || 'false' }}
      INSTALL_CPP_TOOLS: "false"
      INSTALL_SIMULATION_DEPS: "false"
      ROS_DISTRO: ${{ inputs.ros_distro }}
      ROS_IMAGE: ros:${{ inputs.ros_image_tag }}@sha256:${{ inputs.ros_image_digest }}
      ROS_IMAGE_DIGEST: ${{ inputs.ros_image_digest }}
      ROS_IMAGE_REPOSITORY: ros
      ROS_IMAGE_TAG: ${{ inputs.ros_image_tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.git_ref || github.sha }}
      - run: touch /tmp/devcontainer-empty-ssh-agent
      - name: Setup devcontainer environment
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: /bin/true
      - name: Download colcon build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ros-${{ inputs.ros_distro }}-livekit-portal-${{ inputs.arch }}-build-output
          path: /tmp/ros-build-output
      - name: Restore colcon build output
        run: tar --extract --gzip --file /tmp/ros-build-output/ros-build-output.tar.gz
      - name: Package Debian
        id: debian_package
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          DEVCONTAINER_SSH_AUTH_SOCK: /tmp/devcontainer-empty-ssh-agent
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -euo pipefail
              exec ./scripts/package-deb.sh
            '
      - name: Smoke-test Debian in ROS Image
        shell: bash
        run: |
          set -euo pipefail
          deb_path="$(compgen -G 'artifacts/debian/*.deb')"
          docker run --rm --network host --env "CI=true" --env "ROS_DISTRO=${ROS_DISTRO}" --volume "${PWD}/artifacts/debian:/packages:ro" --volume "${PWD}/scripts/smoke-test-deb.sh:/smoke-test-deb.sh:ro" "${ROS_IMAGE}" bash -lc "/smoke-test-deb.sh /packages/$(basename "${deb_path}")"
      - name: Upload Debian package
        if: ${{ always() && !cancelled() && steps.debian_package.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ros-${{ inputs.ros_distro }}-livekit-portal-${{ inputs.arch }}-deb
          path: |
            artifacts/debian/*.deb
            artifacts/debian/*.sha256
          if-no-files-found: error
