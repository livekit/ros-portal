name: Debian Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful CI run ID containing the Debian package artifacts
        required: true
        type: string
      publish:
        description: Publish the CI packages to the selected version tag's GitHub prerelease
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: debian-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub prerelease
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out selected ref
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Validate source CI run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          workflow_path="$(jq -r '.path' <<<"${run_json}")"
          conclusion="$(jq -r '.conclusion' <<<"${run_json}")"
          head_sha="$(jq -r '.head_sha' <<<"${run_json}")"

          if [[ "${workflow_path}" != ".github/workflows/ci.yml" ]]; then
            echo "Run ${SOURCE_RUN_ID} belongs to ${workflow_path}, not CI" >&2
            exit 1
          fi
          if [[ "${conclusion}" != "success" ]]; then
            echo "CI run ${SOURCE_RUN_ID} concluded with ${conclusion}, not success" >&2
            exit 1
          fi
          if [[ "${head_sha}" != "${GITHUB_SHA}" ]]; then
            echo "CI run ${SOURCE_RUN_ID} built ${head_sha}, not selected tag commit ${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ros2-livekit-bridge-*.deb
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Validate release tag and packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            python3 - <<'PY'
          import xml.etree.ElementTree as ET
          print(ET.parse("src/ros2_livekit_bridge/package.xml").getroot().findtext("version"))
          PY
          )"
          if [[ "${GITHUB_REF}" != "refs/tags/v${version}" ]]; then
            echo "Publishing requires selecting the existing v${version} tag, got ${GITHUB_REF}" >&2
            exit 1
          fi
          cd release-assets
          for checksum in ./*.sha256; do
            sha256sum --check "${checksum}"
          done
          sha256sum ./*.deb >SHA256SUMS

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release-assets/*.deb release-assets/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release-assets/*.deb release-assets/SHA256SUMS \
              --generate-notes \
              --prerelease \
              --title "ROS LiveKit Bridge ${GITHUB_REF_NAME}" \
              --verify-tag
          fi
