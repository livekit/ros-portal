name: Debian Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Attach packages to the selected version tag's GitHub prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: debian-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package (${{ matrix.ros_distro }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            ros_distro: humble
            ros_image_digest: afb40d6be65331c20a114d4e229a7ef099fed1b17bf6370daee193514b32aa16
            ros_image_tag: humble-ros-base-jammy
          - os: ubuntu-24.04-arm
            arch: arm64
            ros_distro: humble
            ros_image_digest: afb40d6be65331c20a114d4e229a7ef099fed1b17bf6370daee193514b32aa16
            ros_image_tag: humble-ros-base-jammy
          - os: ubuntu-24.04
            arch: amd64
            ros_distro: jazzy
            ros_image_digest: 31daab66eef9139933379fb67159449944f4e2dcf2e22c2d12cc715f29873e0f
            ros_image_tag: jazzy-ros-base-noble
          - os: ubuntu-24.04-arm
            arch: arm64
            ros_distro: jazzy
            ros_image_digest: 31daab66eef9139933379fb67159449944f4e2dcf2e22c2d12cc715f29873e0f
            ros_image_tag: jazzy-ros-base-noble
          - os: ubuntu-24.04
            arch: amd64
            ros_distro: kilted
            ros_image_digest: 5a91562b35fe8ce33082df7221ec564c0172ae9b242352a45562deb1ddbf2702
            ros_image_tag: kilted-ros-base-noble
          - os: ubuntu-24.04-arm
            arch: arm64
            ros_distro: kilted
            ros_image_digest: 5a91562b35fe8ce33082df7221ec564c0172ae9b242352a45562deb1ddbf2702
            ros_image_tag: kilted-ros-base-noble
          - os: ubuntu-24.04
            arch: amd64
            ros_distro: lyrical
            ros_image_digest: 728bd3a5acfb689b5c80d9ba13e35b0bddbf2219ec880071304237a11447fe7f
            ros_image_tag: lyrical-ros-base-resolute
          - os: ubuntu-24.04-arm
            arch: arm64
            ros_distro: lyrical
            ros_image_digest: 728bd3a5acfb689b5c80d9ba13e35b0bddbf2219ec880071304237a11447fe7f
            ros_image_tag: lyrical-ros-base-resolute
    env:
      BUILD_LIVEKIT_SDK_FROM_SOURCE: ${{ matrix.ros_distro == 'humble' && 'true' || 'false' }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      INSTALL_CPP_TOOLS: "false"
      INSTALL_SIMULATION_DEPS: "false"
      ROS_DISTRO: ${{ matrix.ros_distro }}
      ROS_IMAGE: ros:${{ matrix.ros_image_tag }}@sha256:${{ matrix.ros_image_digest }}
      ROS_IMAGE_DIGEST: ${{ matrix.ros_image_digest }}
      ROS_IMAGE_REPOSITORY: ros
      ROS_IMAGE_TAG: ${{ matrix.ros_image_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Prepare devcontainer SSH agent mount
        run: touch /tmp/devcontainer-empty-ssh-agent

      - name: Set up packaging environment
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never

      - name: Build Debian package
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          DEVCONTAINER_SSH_AUTH_SOCK: /tmp/devcontainer-empty-ssh-agent
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: ./scripts/build-deb.sh

      - name: Smoke-test clean installation
        shell: bash
        run: |
          set -euo pipefail
          deb_path="$(compgen -G 'artifacts/debian/*.deb')"
          docker run --rm \
            --env "ROS_DISTRO=${ROS_DISTRO}" \
            --volume "${PWD}/artifacts/debian:/packages:ro" \
            --volume "${PWD}/scripts/smoke-test-deb.sh:/smoke-test-deb.sh:ro" \
            "${ROS_IMAGE}" \
            bash -lc "/smoke-test-deb.sh /packages/$(basename "${deb_path}")"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ matrix.ros_distro }}-${{ matrix.arch }}
          path: |
            artifacts/debian/*.deb
            artifacts/debian/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out selected ref
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deb-*
          path: release-assets
          merge-multiple: true

      - name: Validate release tag and packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            python3 - <<'PY'
          import xml.etree.ElementTree as ET
          print(ET.parse("src/ros2_livekit_bridge/package.xml").getroot().findtext("version"))
          PY
          )"
          if [[ "${GITHUB_REF}" != "refs/tags/v${version}" ]]; then
            echo "Publishing requires selecting the existing v${version} tag, got ${GITHUB_REF}" >&2
            exit 1
          fi
          cd release-assets
          for checksum in ./*.sha256; do
            sha256sum --check "${checksum}"
          done
          sha256sum ./*.deb >SHA256SUMS

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release-assets/*.deb release-assets/SHA256SUMS --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              release-assets/*.deb release-assets/SHA256SUMS \
              --generate-notes \
              --prerelease \
              --title "ROS LiveKit Bridge ${GITHUB_REF_NAME}" \
              --verify-tag
          fi
