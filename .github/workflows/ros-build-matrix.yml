name: ROS Build Matrix

on:
  workflow_call:
    inputs:
      git_ref:
        description: Git ref whose matrix definition should be used
        required: false
        type: string
    outputs:
      matrix:
        description: ROS distribution and architecture build matrix
        value: ${{ jobs.load.outputs.matrix }}

permissions:
  contents: read

jobs:
  load:
    name: Load ROS Build Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.git_ref || github.sha }}

      - name: Load build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(jq -ce '
            if (.include | type) == "array" and (.include | length) > 0 then
              {include: .include}
            else
              error("expected a non-empty include array")
            end
          ' .github/ros-build-matrix.json)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
