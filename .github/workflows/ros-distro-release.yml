name: ROS Distribution Release (Dry Run)

on:
  workflow_dispatch:
    inputs:
      ros_distro:
        description: ROS distribution to prepare
        required: true
        type: choice
        options:
          - humble
          - jazzy
          - kilted
          - lyrical

permissions:
  contents: read

jobs:
  prepare:
    name: Publish to ROS Distribution (${{ inputs.ros_distro }}, dry run)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Validate release versions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t versions < <(
            python3 - \
              src/ros_portal/package.xml \
              src/ros_portal_config/package.xml \
              src/ros_portal_msgs/package.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          for package_xml in sys.argv[1:]:
              print(ET.parse(package_xml).getroot().findtext("version"))
          PY
          )
          if [[ "${#versions[@]}" -ne 3 ]] ||
            [[ "${versions[0]}" != "${versions[1]}" ]] ||
            [[ "${versions[0]}" != "${versions[2]}" ]]; then
            echo "First-party package.xml versions must be identical" >&2
            exit 1
          fi
          echo "Release version: ${versions[0]}"

      # TODO BOT-495: Replace this placeholder with the reviewed bloom release
      # process after the release repository and rosdistro entries exist.
      - name: Publish to ROS Distribution
        env:
          ROS_DISTRO: ${{ inputs.ros_distro }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## ROS Distribution release dry run"
            echo
            echo "No package was published and no rosdistro pull request was opened."
            echo
            echo "Planned Debian package: \`ros-${ROS_DISTRO}-livekit-portal\`"
            echo "Planned repository key: \`ros_portal\`"
            echo "Planned release repository: \`https://github.com/ros2-gbp/ros_portal-release.git\`"
            echo "Planned release tag: \`release/${ROS_DISTRO}/{package}/{version}\`"
            echo
            echo "Future bloom dry run:"
            echo "\`bloom-release ros_portal --ros-distro ${ROS_DISTRO} --pretend\`"
            echo
            echo "Before enabling publication, create the release repository, add the"
            echo "source/release entries to ros/rosdistro, and verify that all bundled"
            echo "first-party and ros2_medkit dependencies are available to the ROS build farm."
            echo "The ros_portal package blooms as \`ros-${ROS_DISTRO}-ros-portal\`,"
            echo "which differs from the custom Debian package name"
            echo "\`ros-${ROS_DISTRO}-livekit-portal\` used by this repository."
          } | tee -a "${GITHUB_STEP_SUMMARY}"
