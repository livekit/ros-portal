name: Tests

on:
  workflow_call:
    inputs:
      ros_distro: {required: true, type: string}
      arch: {required: true, type: string}
      os: {required: true, type: string}
      ros_image_tag: {required: true, type: string}
      ros_image_digest: {required: true, type: string}
      git_ref: {required: false, type: string}
      test_repetitions:
        description: Number of successful executions required for each selected CTest test
        required: false
        default: 1
        type: number
      timeout_minutes:
        description: Maximum duration of this test job in minutes
        required: false
        default: 90
        type: number

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      LIVEKIT_BUILD_SDK_FROM_SOURCE: "false"
      INSTALL_CPP_TOOLS: "false"
      INSTALL_SIMULATION_DEPS: "false"
      ROS_DISTRO: ${{ inputs.ros_distro }}
      ROS_IMAGE_DIGEST: ${{ inputs.ros_image_digest }}
      ROS_IMAGE_REPOSITORY: ros
      ROS_IMAGE_TAG: ${{ inputs.ros_image_tag }}
      TEST_REPETITIONS: ${{ inputs.test_repetitions }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.git_ref || github.sha }}
      - run: touch /tmp/devcontainer-empty-ssh-agent
      - name: Setup devcontainer environment
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: /bin/true
      - name: Download colcon build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ros-${{ inputs.ros_distro }}-livekit-portal-${{ inputs.arch }}-build-output
          path: /tmp/ros-build-output
      - name: Restore colcon build output
        run: tar --extract --gzip --file /tmp/ros-build-output/ros-build-output.tar.gz
      - name: Validate test configuration
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${TEST_REPETITIONS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "test_repetitions must be a positive integer; got: ${TEST_REPETITIONS}" >&2
            exit 1
          fi
      - name: "colcon test: unit"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u
              test_repetitions="${{ inputs.test_repetitions }}"
              retest_until_fail=$((test_repetitions - 1))
              echo "===== Run each unit CTest test ${test_repetitions} times ====="
              test_exit=0
              GTEST_COLOR=1 colcon test --packages-up-to ros_portal test_utilities custom_msgs --packages-skip ros2_medkit_serialization --event-handlers console_direct+ --return-code-on-test-failure --retest-until-fail "${retest_until_fail}" --ctest-args -R ros_portal_unit_tests || test_exit=$?
              colcon test-result --verbose --all
              exit "${test_exit}"
            '
      - name: Start livekit-server
        id: livekit_server
        uses: livekit/dev-server-action@6562d7d9343e46c26ead1223151f64f00e4fc37f # v1.1.0
        with:
          github-token: ${{ github.token }}
          version: v1.13.3
          config: |
            enable_participant_data_blob: true
      - name: "colcon test: integration"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          CI: true
          GITHUB_TOKEN: ${{ github.token }}
          LIVEKIT_URL: ws://127.0.0.1:7880
          LIVEKIT_ROOM: ros_portal_test_room
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u
              source .token_helpers/set_test_tokens.bash
              test_repetitions="${{ inputs.test_repetitions }}"
              retest_until_fail=$((test_repetitions - 1))
              echo "===== Run each integration CTest test ${test_repetitions} times ====="
              test_exit=0
              GTEST_COLOR=1 colcon test --packages-select ros_portal --event-handlers console_direct+ --return-code-on-test-failure --retest-until-fail "${retest_until_fail}" --ctest-args -R ros_portal_integration_tests || test_exit=$?
              colcon test-result --verbose --all
              exit "${test_exit}"
            '
      - name: "colcon test: connection faults"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          CI: true
          GITHUB_TOKEN: ${{ github.token }}
          LIVEKIT_URL: ws://127.0.0.1:7880
          LIVEKIT_ROOM: ros_portal_test_room
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u
              source .token_helpers/set_test_tokens.bash
              export ROS_PORTAL_RUN_CONNECTION_FAULT_TESTS=1
              test_repetitions="${{ inputs.test_repetitions }}"
              retest_until_fail=$((test_repetitions - 1))
              echo "===== Run each connection-fault CTest test ${test_repetitions} times ====="
              test_exit=0
              GTEST_COLOR=1 colcon test --packages-select ros_portal --event-handlers console_direct+ --return-code-on-test-failure --retest-until-fail "${retest_until_fail}" --ctest-args -R ros_portal_connection_fault_tests || test_exit=$?
              colcon test-result --verbose --all
              exit "${test_exit}"
            '
      - name: Dump LiveKit server log on failure
        if: failure()
        run: tail -n 500 "${{ steps.livekit_server.outputs.log-path }}" || true
