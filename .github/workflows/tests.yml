name: Tests

on:
  workflow_call:
    inputs:
      ros_distro: {required: true, type: string}
      arch: {required: true, type: string}
      os: {required: true, type: string}
      ros_image_tag: {required: true, type: string}
      ros_image_digest: {required: true, type: string}
      git_ref: {required: false, type: string}

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    env:
      LIVEKIT_BUILD_SDK_FROM_SOURCE: "false"
      INSTALL_CPP_TOOLS: "false"
      INSTALL_SIMULATION_DEPS: "false"
      ROS_DISTRO: ${{ inputs.ros_distro }}
      ROS_IMAGE_DIGEST: ${{ inputs.ros_image_digest }}
      ROS_IMAGE_REPOSITORY: ros
      ROS_IMAGE_TAG: ${{ inputs.ros_image_tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.git_ref || github.sha }}
      - run: touch /tmp/devcontainer-empty-ssh-agent
      - name: Setup devcontainer environment
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: /bin/true
      - name: Download colcon build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ros-${{ inputs.ros_distro }}-livekit-portal-${{ inputs.arch }}-build-output
          path: /tmp/ros-build-output
      - name: Restore colcon build output
        run: tar --extract --gzip --file /tmp/ros-build-output/ros-build-output.tar.gz
      - name: "colcon test: unit"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u
              test_exit=0
              GTEST_COLOR=1 colcon test --packages-up-to ros_portal test_utilities custom_msgs --packages-skip ros2_medkit_serialization --event-handlers console_direct+ --return-code-on-test-failure --ctest-args -R ros_portal_unit_tests || test_exit=$?
              colcon test-result --verbose --all
              exit $test_exit
            '
      - name: Start livekit-server
        id: livekit_server
        uses: livekit/dev-server-action@6562d7d9343e46c26ead1223151f64f00e4fc37f # v1.1.0
        with:
          github-token: ${{ github.token }}
          version: v1.13.3
          config: |
            enable_participant_data_blob: true
      - name: "colcon test: integration"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          env: |
            CI=true
            LIVEKIT_URL=ws://127.0.0.1:7880
            LIVEKIT_ROOM=ros_portal_test_room
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u
              source .token_helpers/set_test_tokens.bash
              test_exit=0
              GTEST_COLOR=1 colcon test --packages-select ros_portal --event-handlers console_direct+ --return-code-on-test-failure --ctest-args -R ros_portal_integration_tests || test_exit=$?
              colcon test-result --verbose --all
              exit $test_exit
            '
      - name: "colcon test: connection faults"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          env: |
            CI=true
            LIVEKIT_URL=ws://127.0.0.1:7880
            LIVEKIT_ROOM=ros_portal_test_room
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u
              source .token_helpers/set_test_tokens.bash
              export ROS_PORTAL_RUN_CONNECTION_FAULT_TESTS=1
              test_exit=0
              GTEST_COLOR=1 colcon test --packages-select ros_portal --event-handlers console_direct+ --return-code-on-test-failure --ctest-args -R ros_portal_connection_fault_tests || test_exit=$?
              colcon test-result --verbose --all
              exit $test_exit
            '
      - name: Start token server
        id: token_server
        uses: livekit/token-server-action@a1e42c649a1998d5b224f5102f252c07762024f0 # v0.0.1
        with:
          livekit-url: ws://127.0.0.1:7880
          api-key: devkey
          api-secret: secret
      - name: "ros2 run: endpoint token server"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          push: never
          # Must be the `env` input: a step-level `env:` only reaches the runner,
          # not the dev container that runs `runCmd`.
          env: |
            LIVEKIT_TOKEN_ENDPOINT=${{ steps.token_server.outputs.token-url }}
          runCmd: |
            bash -lc '
              set -eo pipefail
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              source install/setup.bash
              set -u
              unset LIVEKIT_TOKEN
              unset LIVEKIT_TOKEN_SERVER_ID

              if [ -z "${LIVEKIT_TOKEN_ENDPOINT:-}" ]; then
                echo "LIVEKIT_TOKEN_ENDPOINT is not set inside the dev container"
                exit 1
              fi
              echo "Using token endpoint: ${LIVEKIT_TOKEN_ENDPOINT}"

              log_path="$(mktemp)"
              ros2 run ros_portal ros_portal_node --ros-args --disable-external-lib-logs >"${log_path}" 2>&1 &
              portal_pid=$!
              cleanup() {
                if kill -0 "${portal_pid}" 2>/dev/null; then
                  kill "${portal_pid}" 2>/dev/null || true
                  wait "${portal_pid}" || true
                fi
              }
              trap cleanup EXIT

              for _ in $(seq 1 45); do
                if grep -q "Connected to LiveKit room" "${log_path}"; then
                  echo "ROS Portal connected through endpoint token server"
                  exit 0
                fi
                if ! kill -0 "${portal_pid}" 2>/dev/null; then
                  echo "ROS Portal exited before connecting"
                  cat "${log_path}"
                  wait "${portal_pid}"
                  exit 1
                fi
                sleep 1
              done

              echo "Timed out waiting for ROS Portal to connect through endpoint token server"
              cat "${log_path}"
              exit 1
            '
      - name: Dump LiveKit server log on failure
        if: failure()
        run: tail -n 500 "${{ steps.livekit_server.outputs.log-path }}" || true
      - name: Dump token server log on failure
        if: failure() && steps.token_server.outputs.log-path != ''
        run: tail -n 200 "${{ steps.token_server.outputs.log-path }}" || true
