#
# ScaRF-SLAM demo, edge robot side (Jetson). See README.md.
#
# Sends the side-by-side (SBS) stereo JPEG topic as one LiveKit video track.
# One track keeps both eyes in one frame with one stamp. The topic
# /stereo/image_raw/compressed becomes the track /stereo/image_raw.

$schema: https://raw.githubusercontent.com/livekit/ros-portal/main/src/ros_portal_config/schema/ros_portal_config.schema.json

ros_portal:
  version: "0.0.1"
  ros_threads: 4

  topics:
    - topic: "/stereo/image_raw/compressed"
      direction: "out"
      video_options:
        bitrate_kbps: 8000
