# RTAB-Map parameters for stereo-only SLAM on the rectified SBS stream.
# Both stereo_odometry and rtabmap read this file. RTAB-Map core parameters
# (the names with a slash) are strings.

/**:
  ros__parameters:
    frame_id: stereo_link
    subscribe_stereo: true
    subscribe_depth: false
    subscribe_rgb: false
    # Both rectified images carry the stamp of one SBS frame.
    approx_sync: false
    sync_queue_size: 10
    wait_for_transform: 0.2

    # Add a graph node at most 3 times per second. This matches the ScaRF-SLAM
    # keyframe selection (sec_skip: 0.32). RTAB-Map adds no node while the
    # rover stands still (RGBD/LinearUpdate and RGBD/AngularUpdate).
    Rtabmap/DetectionRate: "3"
    # Keep all nodes in working memory, so that MapData has the full graph.
    Rtabmap/MemoryThr: "0"
    Mem/IncrementalMemory: "true"

    Odom/Strategy: "0"
    Vis/MaxFeatures: "1000"
    Vis/CorType: "0"
    Reg/Force3DoF: "false"
