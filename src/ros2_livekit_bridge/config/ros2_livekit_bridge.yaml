ros2_livekit_bridge:
  version: "0.0.1"
  room_name: "robo_room"
  topic_polling_period_ms: 500
  ros_threads: 4

  services:
    - service: "/remote/add_two_ints"
      msg_type: "example_interfaces/srv/AddTwoInts"
      direction: "out"
      participant: "robot-a"

    - service: "/set_bool"
      msg_type: "std_srvs/srv/SetBool"
      direction: "in"
      participant: "operator"

    - service: "/remote/trigger"
      msg_type: "std_srvs/srv/Trigger"
      direction: "bidirectional"
      participant: "robot-a"

  topics:
    - topic: "/rgbd_camera/image"
      direction: "out"

    - topic: "/laser_scan"
      direction: "out"

    - topic: "/lidar/points"
      direction: "out"

    - topic: "/odom"
      direction: "out"

    - topic: "/battery_state"
      direction: "out"

    - topic: "/tf.*"
      direction: "out"

    - topic: "/test/.*"
      direction: "bidirectional"
