ros_livekit_bridge:
  version: "0.0.1"

  room_options:
    join_retries: 3

  services:
    - service: "/go_to_pose"
      direction: "in"
      participant: "robot-a"

    - service: "/provide_status"
      direction: "out"
      participant: "robot-a"

  topics:
    - topic: "/camera/image_raw"
      direction: "out"
      video_options:
        bitrate_kbps: 3500
        codec: "h264"

    - topic: "/lidar/points"
      direction: "out"

    - topic: "/odom"
      direction: "bidirectional"

    - topic: "/battery_state"
      direction: "out"

    - topic: "/current_task"
      direction: "bidirectional"

    - topic: "/teleop_cmd"
      direction: "in"

    # Audio is planned for a v2 config. The v1 parser intentionally rejects
    # audio_options, so keep this example commented until that schema lands.
    # - topic: "/mic/audio_left"
    #   direction: "out"
    #   audio_options:
    #     bitrate_kbps: 500
    #     codec: "wav"
