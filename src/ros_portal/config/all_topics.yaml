# This file mirrors the node's builtin default config (used when no
# `config_path` is provided): it forwards all topics bidirectionally. Kept in
# sync with `kDefaultConfigYaml` in ros_utils.hpp (verified by unit test).
ros_portal:
  version: "0.0.1"
  topic_polling_period_ms: 500

  topics:
    - topic: ".*"
      direction: "bidirectional"
