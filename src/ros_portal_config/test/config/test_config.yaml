ros_portal:
  version: "0.0.1"
  topic_polling_period_ms: 500

  services:
    # Services only support "direction: out". Each route creates a local ROS
    # service server that forwards calls to the configured LiveKit participant.
    - service: "/go_to_pose"
      direction: "out"
      participant: "robot-a"
      msg_type: "nav2_msgs/srv/ComputePathToPose"

    - service: "/provide_status"
      direction: "out"
      participant: "robot-a"
      msg_type: "std_srvs/srv/Trigger"
      # Todo enable user timeout

  topics:
    - topic: "/camera/image_raw"
      direction: "out"

    - topic: "/lidar/points"
      direction: "out"
      max_rate_hz: 10

    - topic: "/odom"
      direction: "bidirectional"

    - topic: "/battery_state"
      direction: "out"

    - topic: "/current_task"
      direction: "bidirectional"

    - topic: "/teleop_cmd"
      direction: "in"
      preserve_id: true

    # Audio is planned for a v2 config. The v1 parser intentionally rejects
    # audio_options, so keep this example commented until that schema lands.
    # - topic: "/mic/audio_left"
    #   direction: "out"
    #   audio_options:
    #     bitrate_kbps: 500
    #     codec: "wav"

  video_sources:
    - track_name: "front_camera"
      source:
        type: "gstreamer"
        pipeline: >-
          videotestsrc is-live=true ! videoconvert ! x264enc name=lk_encoder
          tune=zerolatency ! h264parse ! appsink name=lk_appsink
        codec: "h264"
        resolution:
          width: 1280
          height: 720
        rate_control:
          element: "lk_encoder"
          property: "bitrate"
          unit: "kbps"
      publish_options:
        max_bitrate_bps: 3500000
        max_framerate: 30

    # Pixel sources can be published as simulcast; encoded (gstreamer) sources
    # publish the single pre-encoded layer they produce and ignore the flag.
    - track_name: "demo_camera"
      simulcast: true
      source:
        type: "demo"
        demo:
          resolution:
            width: 640
            height: 480
          framerate_fps: 30

    # Native device capture: no GStreamer pipeline, no GStreamer runtime deps.
    # Discover ids with `ros2 run ros_portal capture_devices`.
    - track_name: "usb_camera"
      source:
        type: "device"
        device:
          index: 0
          format:
            strategy: "closest"
            resolution:
              width: 1280
              height: 720
            framerate_fps: 30
      publish_options:
        max_framerate: 30
