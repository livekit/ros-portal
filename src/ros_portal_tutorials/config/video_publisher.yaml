#
# Video pass-through tutorial, publisher side. See docs/tutorials.md.
#
# Sends the JPEG camera topic from the bag as a LiveKit video track. A
# CompressedImage topic named <base>/compressed becomes the track <base>, so the
# track here is /insta/cam0/image_raw.

$schema: https://raw.githubusercontent.com/livekit/ros-portal/main/src/ros_portal_config/schema/ros_portal_config.schema.json

ros_portal:
  version: "0.0.1"
  ros_threads: 4

  topics:
    - topic: "/insta/cam0/image_raw/compressed"
      direction: "out"
