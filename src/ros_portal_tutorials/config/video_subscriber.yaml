#
# Video pass-through tutorial, subscriber side. See docs/tutorials.md.
#
# Receives the LiveKit video track /insta/cam0/image_raw and republishes it as
# sensor_msgs/CompressedImage on /insta/cam0/image_raw/compressed. Video tracks
# match by exact name, so this entry is not a regex.

$schema: https://raw.githubusercontent.com/livekit/ros-portal/main/src/ros_portal_config/schema/ros_portal_config.schema.json

ros_portal:
  version: "0.0.1"
  ros_threads: 4

  topics:
    - topic: "/insta/cam0/image_raw"
      direction: "in"
