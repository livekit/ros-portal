livekit_generate_params_node:
  ros__parameters:
    version: "0.0.1"

    # See the Room Options section below for a full list.
    room_options:
      join_retries: 3

    services:
      names:
        - go_to_pose
        - provide_status
      go_to_pose:
        service: "/go_to_pose"
        direction: "in"
        participant: "robot-a"
      provide_status:
        service: "/provide_status"
        direction: "out"
        participant: "robot-a"

    topics:
      names:
        - camera_image_raw
        - lidar_points
        - odom
        - battery_state
        - current_task
        - teleop_cmd
        - mic_audio_left
      camera_image_raw:
        topic: "/camera/image_raw"
        direction: "out"
        video_options:
          enabled: true
          bitrate_kbps: 3500
          codec: "h264"
      lidar_points:
        topic: "/lidar/points"
        direction: "out"
      odom:
        topic: "/odom"
        direction: "bidirectional"
      battery_state:
        topic: "/battery_state"
        direction: "out"
      current_task:
        topic: "/current_task"
        direction: "bidirectional"
      teleop_cmd:
        topic: "/teleop_cmd"
        direction: "in"
      # Audio is a v2 task.
      mic_audio_left:
        topic: "/mic/audio_left"
        direction: "out"
        audio_options:
          enabled: true
          bitrate_kbps: 500
          codec: "wav"
