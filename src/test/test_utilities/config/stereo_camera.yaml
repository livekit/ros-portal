# yaml-language-server: $schema=../../ros_portal_config/schema/ros_portal_config.schema.json
# Copyright 2026 LiveKit
#
# Publishes a stereo camera as two LiveKit video tracks. Each camera is read
# and encoded by a GStreamer pipeline, so this does not require a ROS camera
# driver or any ROS image topics. The pipelines use V4L2 and run on Linux.
#
# Run it locally (mints a dev token and joins `robo_room`):
#
#   ros2 launch ros_portal ros_portal_local.launch.py \
#     config_path:=$(ros2 pkg prefix ros_portal)/share/ros_portal/config/stereo_camera.yaml
#
# FIRST: find your cameras and replace the `/dev/videoN` paths below.
#
#   v4l2-ctl --list-devices
#
# UVC cameras commonly claim two nodes each (capture + metadata), so two
# physical cameras are often video0 and video2 rather than video0 and video1.

ros_portal:
  version: "0.0.1"

  video_sources:
    - track_name: "stereo_left"
      source:
        type: "gstreamer"
        pipeline: >-
          v4l2src device=/dev/video0 ! videoconvert !
          video/x-raw,width=1280,height=720,framerate=30/1 !
          x264enc name=lk_encoder tune=zerolatency speed-preset=ultrafast key-int-max=30 !
          h264parse config-interval=-1 ! video/x-h264,stream-format=byte-stream,alignment=au !
          appsink name=lk_appsink
        rate_control:
          element: "lk_encoder"
          property: "bitrate"
          unit: "kbps"
      publish_options:
        # Two tracks share the uplink, so budget per eye rather than per stream.
        max_bitrate_bps: 2500000
        max_framerate: 30

    - track_name: "stereo_right"
      source:
        type: "gstreamer"
        pipeline: >-
          v4l2src device=/dev/video2 ! videoconvert !
          video/x-raw,width=1280,height=720,framerate=30/1 !
          x264enc name=lk_encoder tune=zerolatency speed-preset=ultrafast key-int-max=30 !
          h264parse config-interval=-1 ! video/x-h264,stream-format=byte-stream,alignment=au !
          appsink name=lk_appsink
        rate_control:
          element: "lk_encoder"
          property: "bitrate"
          unit: "kbps"
      publish_options:
        max_bitrate_bps: 2500000
        max_framerate: 30

# ---------------------------------------------------------------------------
# If your rig is a single side-by-side ("dual lens") camera
# ---------------------------------------------------------------------------
# Many USB stereo cameras expose ONE device that delivers both eyes in one wide
# frame. In that case use a single source at the full stitched width and let the
# subscriber split it, e.g. 2560x720 for a 2x 1280x720 pair. Some of these
# cameras only offer the widest modes as MJPEG, so decode it first:
#
#   video_sources:
#     - track_name: "stereo"
#       source:
#         type: "gstreamer"
#         pipeline: >-
#           v4l2src device=/dev/video0 !
#           image/jpeg,width=2560,height=720,framerate=30/1 ! jpegdec ! videoconvert !
#           x264enc name=lk_encoder tune=zerolatency speed-preset=ultrafast key-int-max=30 !
#           h264parse config-interval=-1 ! video/x-h264,stream-format=byte-stream,alignment=au !
#           appsink name=lk_appsink
#         rate_control: { element: "lk_encoder", property: "bitrate", unit: "kbps" }
#       publish_options:
#         max_bitrate_bps: 5000000
#         max_framerate: 30
#
# ---------------------------------------------------------------------------
# Notes
# ---------------------------------------------------------------------------
# - Watch `video_source/stereo_left/0` and `video_source/stereo_right/1` on
#   /diagnostics for per-source state; one camera failing does not stop the
#   other or the node.
# - In a container the device nodes must be mapped in (`--device /dev/video0`,
#   `--device /dev/video2`).
# - If your camera is already published as sensor_msgs/msg/Image by a ROS
#   driver, forward those topics with an outbound `topics` entry instead.
