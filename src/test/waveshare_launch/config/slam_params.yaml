# slam_toolbox online-async params, Pi-4-tuned copy owned by waveshare_launch.
#
# Forked from waver_nav/param/mapper_params_online_async.yaml (vendored, re-imported
# by vcs, so edits there don't persist). slam.launch.py defaults to THIS file.
#
# Why the fork: on the CPU-bound Pi 4, stock slam_toolbox couldn't keep up during a
# nav run -- `map->odom` was published ~2.08s avg / 4.9s max STALE (measured via
# `tf2_monitor robot_1/map robot_1/base_footprint`, 2026-07-15), while /scan (0.1s)
# and the EKF odom->base (0.066s) were healthy. That stale localization made every
# nav2 map-frame transform fail ("Unable to transform robot pose into global plan's
# frame") and aborted goals. The changes below cut scan-match/map cost to bring
# `map->odom` back under real-time (target delay < 0.3s). Diffs from upstream are
# marked "Pi:"; everything else is inherited verbatim.
#
# Frames here are unprefixed; slam.launch.py rewrites map/odom/base to "<robot_name>/".
slam_toolbox:
  ros__parameters:
    # Solver Params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss
    mode: mapping

    # Toolbox Params
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    restamp_tf: false
    scan_queue_size: 1
    use_map_saver: true

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false
    throttle_scans: 2            # Pi: 1->2, match at ~5 Hz not 10 -- ~halves scan-match load
    transform_publish_period: 0.02
    map_update_interval: 1.0
    enable_interactive_mode: true
    position_covariance_scale: 1.0
    yaw_covariance_scale: 1.0
    resolution: 0.05             # Pi: 0.025->0.05, 4x fewer map cells (CPU + RAM + publish)
    min_laser_range: 0.03
    max_laser_range: 8.0         # Pi: 12.0->8.0, fewer beams per match (fine indoors)
    minimum_time_interval: 0.1
    transform_timeout: 0.25
    tf_buffer_duration: 30.0
    stack_size_to_use: 80000000
    minimum_travel_distance: 0.10

    # Matcher Params
    use_scan_matching: true
    use_scan_barycenter: false
    minimum_travel_heading: 0.20 # Pi: 0.10->0.20, fewer re-matches during rotation
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.40
    link_scan_maximum_distance: 2.0
    loop_search_maximum_distance: 5.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.50
    loop_match_minimum_response_fine: 0.75

    # Correlation Params - Correlation Params
    correlation_search_space_dimension: 0.8
    correlation_search_space_resolution: 0.01   # Pi: 0.005->0.01, coarser matcher grid -- big CPU win
    correlation_search_space_smear_deviation: 0.05

    # Correlation Params - Loop Closure Params
    loop_search_space_dimension: 10.0
    loop_search_space_resolution: 0.025
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Params
    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.3
    fine_search_angle_offset: 0.00175
    coarse_search_angle_offset: 0.523
    coarse_angle_resolution: 0.0174
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 3
    occupancy_threshold: 0.1

    # Unknown Params
    check_min_dist_and_heading_precisely: true
