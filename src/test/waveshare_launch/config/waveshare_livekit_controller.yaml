ros_portal:
  version: "0.0.1"
  topic_polling_period_ms: 500

  topics:
    # Robot telemetry consumed from LiveKit (LiveKit -> ROS)
    - topic: "/map"
      direction: "in"

    - topic: "/plan"
      direction: "in"

    - topic: "/robot_description"
      direction: "in"

    - topic: "/scan"
      direction: "in"

    - topic: "/camera/image_raw"
      direction: "in"

    - topic: "/pose"
      direction: "in"

    - topic: "/slam_toolbox/graph_visualization"
      direction: "in"

    - topic: "/global_costmap/published_footprint"
      direction: "in"

    # Transform tree — gives this graph a valid fixed frame so Foxglove's 3D
    # panel can resolve frames and show the click-to-publish tool. Keep these at
    # the top level (not namespaced): TF frame_ids are global and Foxglove
    # consumes /tf and /tf_static directly.
    - topic: "/tf"
      direction: "in"

    # /tf_static is latched: received over the RPC push-with-ack path and
    # republished on a TRANSIENT_LOCAL publisher, so Foxglove (or any consumer)
    # that starts after ROS Portal still resolves the static frames. The ROS
    # type travels in the RPC payload, so no msg_type is needed here.
    - topic: "/tf_static"
      direction: "in"
      latched: true

    # Commands sent out to the robot (ROS -> LiveKit).
    - topic: "/cmd_vel"
      direction: "out"

    - topic: "/goal_pose"
      direction: "out"

    - topic: "/initialpose"
      direction: "out"

    - topic: "/clicked_point"
      direction: "out"
