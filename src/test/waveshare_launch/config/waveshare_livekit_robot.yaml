ros2_livekit_bridge:
  version: "0.0.1"
  topic_polling_period_ms: 500
  ros_threads: 0

  topics:
    # Commands received from the controller (LiveKit -> ROS).
    - topic: "/cmd_vel"
      direction: "in"

    - topic: "/goal_pose"
      direction: "in"

    - topic: "/initialpose"
      direction: "in"

    - topic: "/clicked_point"
      direction: "in"

    # Telemetry / sensor / nav streams sent out to LiveKit (ROS -> LiveKit)
    - topic: "/map"
      direction: "out"

    - topic: "/plan"
      direction: "out"

    - topic: "/robot_description"
      direction: "out"

    - topic: "/scan"
      direction: "out"

    - topic: "/camera/image_raw"
      direction: "out"

    - topic: "/pose"
      direction: "out"

    - topic: "/slam_toolbox/graph_visualization"
      direction: "out"

    - topic: "/global_costmap/published_footprint"
      direction: "out"

    - topic: "/odom"
      direction: "out"
      encoding: "jsonschema"

    - topic: "/imu/data_raw"
      max_rate_hz: 20
      direction: "out"
      encoding: "jsonschema"

    # Transform tree — required so the controller's Foxglove 3D panel has a
    # valid fixed frame (without it the click-to-publish tool is hidden).
    - topic: "/tf"
      direction: "out"

    # /tf_static is latched (published once at startup with TRANSIENT_LOCAL
    # durability). DataTracks are not latched, so it is forwarded over the RPC
    # push-with-ack path: the bridge stores it and pushes it to every peer that
    # joins, so transforms published before the controller connected still
    # arrive. See `latched` in docs/configuration.md.
    - topic: "/tf_static"
      direction: "out"
      latched: true
