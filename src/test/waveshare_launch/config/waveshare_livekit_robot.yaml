ros2_livekit_bridge:
  version: "0.0.1"
  room_name: "robo_room"
  topic_polling_period_ms: 500
  ros_threads: 4

  topics:
    # Commands received from the controller (LiveKit -> ROS)
    - topic: "/cmd_vel"
      direction: "in"

    - topic: "/goal_pose"
      direction: "in"

    # Telemetry / sensor / nav streams sent out to LiveKit (ROS -> LiveKit)
    - topic: "/map"
      direction: "out"

    - topic: "/plan"
      direction: "out"

    - topic: "/robot_description"
      direction: "out"

    - topic: "/scan"
      direction: "out"

    - topic: "/camera/image_raw"
      direction: "out"

    - topic: "/pose"
      direction: "out"

    - topic: "/slam_toolbox/graph_visualization"
      direction: "out"

    - topic: "/global_costmap/published_footprint"
      direction: "out"
